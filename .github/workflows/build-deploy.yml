name: Build and deploy

# Tests run locally in a clean container (`pnpm verify`, enforced by the pre-push hook).
# This workflow only builds and deploys, and reports start and finish to Slack.
on:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    # On develop, deploy only when the head commit message contains [deploy].
    if: github.ref_name == 'main' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/slack-notify
        with:
          status: start
          title: Deploy
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CICD_CHANNEL }}
      - id: node
        run: echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: build
          push: false
          build-args: NODE_VERSION=${{ steps.node.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # DEPLOY: the product decides the target. Add the deploy step here.
      - uses: ./.github/actions/slack-notify
        if: always()
        with:
          status: ${{ job.status }}
          title: Deploy
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel: ${{ vars.SLACK_CICD_CHANNEL }}
